<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PulseSave — Fast, watermark-free video downloader</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0a0a0f;
        --bg-subtle: #12121a;
        --card: #1a1a24;
        --muted: #6b6b80;
        --accent: #e94a4a;
        --accent-glow: rgba(233, 74, 74, 0.4);
        --text: #f0f0f5;
        --font-family: 'Sora', sans-serif;
        --transition: all 0.3s ease;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: var(--font-family); background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }

      /* Ad slot comments - uncomment and insert your ad HTML */
      /* #ad-top */
      /* <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="XXXXXXXXXX"></ins> */
      /* #ad-infeed */
      /* <ins class="adsbygoogle"
           style="display:block; margin: 24px 0;"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="XXXXXXXXXX"></ins> */
      /* #ad-sidebar */
      /* <ins class="adsbygoogle"
           style="display:block; width: 160px; height: 600px; position: fixed; right: 24px; top: 100px;"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="XXXXXXXXXX"></ins> */
      /* #ad-bottom */
      /* <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="XXXXXXXXXX"></ins> */

      /* CSP: allow ad domains if you uncomment the slots above
       add img-src data: https: to your Content-Security-Policy
       add connect-src https://pagead.googlesyndomain.com if using AdSense */

      body { opacity: 0; animation: fadeIn 0.5s ease forwards; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }

      /* Buttons */
      .btn {
        font: inherit;
        cursor: pointer;
        width: 100%;
        padding: 16px 24px;
        background: var(--accent);
        color: #111;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 1rem;
        transition: var(--transition);
      }
      .btn:hover { background: #d93a3a; }
      .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }

      /* Spinner */
      .spinner { width: 20px; height: 20px; border: 2px solid transparent; border-top-color: currentColor; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Input */
      input {
        font: inherit;
        width: 100%;
        padding: 16px 20px;
        background: var(--bg-subtle);
        border: 1px solid var(--muted);
        border-radius: 8px;
        color: var(--text);
        font-size: 1rem;
        font-family: var(--font-family);
        transition: var(--transition);
      }
      input:focus { outline: none; border-color: var(--accent); }

      /* Cards */
      .card { background: var(--card); border: 1px solid var(--muted); border-radius: 12px; padding: 24px; margin-top: 24px; }
      .card img { width: 100%; border-radius: 8px; margin-bottom: 16px; }
      .badge { display: inline-block; padding: 4px 8px; background: var(--muted); border-radius: 4px; font-size: 0.75rem; margin-right: 6px; margin-bottom: 6px; }
      .badge-tiktok { background: #000; color: #fff; }
      .badge-ig { background: #f76707; color: #fff; }
      .badge-yt { background: #ff0000; color: #fff; }

      /* Empty state */
      .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }

      /* Responsive */
      @media (max-width: 1024px) {
        .sidebar { display: none; }
        .results { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
      }
      @media (max-width: 760px) {
        body { padding: 0 16px; }
        .input-wrapper { flex-direction: column; gap: 12px; }
        .btn { width: 100%; }
        input { width: 100%; }
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: 0.01s !important; animation-duration: 0.01s !important; }
      }
    </style>
  </head>
  <body>
    <main class="max-w-5xl mx-auto px-4 py-8" style="max-width: 1200px;">
      <header class="mb-8" style="margin-bottom: 32px;">
        <h1 class="text-4xl font-bold mb-2" style="font-size: 3rem; margin-bottom: 0.5rem;">PulseSave</h1>
        <p class="text-lg" style="font-size: 1.25rem;">Watermark-free video downloader</p>
      </header>

      <section class="input-wrapper" style="display: flex; gap: 12px; flex-wrap: wrap;">
        <input
          type="text"
          id="url-input"
          placeholder="Paste a TikTok, Instagram Reels, or YouTube link"
          autocomplete="off"
          aria-label="Video URL"
        />
        <button class="btn" id="analyze-btn" aria-label="Analyze video">Analyze</button>
      </section>

      <div id="results" class="grid grid-cols-1 gap-4 mt-6" style="display: grid; gap: 16px;"></div>

      <footer class="mt-8 text-center" style="margin-top: 32px; color: var(--muted); font-size: 0.875rem;">
        Use only with content you have rights to. Respect each platform's ToS.
      </footer>

    </main>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
